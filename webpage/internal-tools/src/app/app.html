<div class="flex h-screen bg-gray-100">
  <!-- Mobile Header -->
  <div
    class="lg:hidden fixed top-0 left-0 right-0 bg-gray-900 text-white p-4 flex items-center justify-between z-50 shadow-lg">
    <h1 class="text-lg font-bold truncate">{{ title }}</h1>
    <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="!isSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="isSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Sidebar Overlay (Mobile) -->
  <div *ngIf="isSidebarOpen" (click)="toggleSidebar()" class="lg:hidden fixed inset-0 bg-black bg-opacity-50 z-40">
  </div>

  <!-- Sidebar -->
  <aside [class]="isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
    class="fixed lg:static w-64 bg-gray-900 text-white transition-transform duration-300 flex flex-col h-full z-40">
    <!-- Header (Desktop only) -->
    <div class="hidden lg:flex p-4 border-b border-gray-700 items-center justify-between">
      <h1 class="text-xl font-bold">{{ title }}</h1>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 mt-16 lg:mt-0">
      <a routerLink="/tickets" routerLinkActive="bg-blue-600" (click)="isSidebarOpen && closeSidebarOnMobile()"
        class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition-colors mb-2">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <span class="font-medium">Tickets</span>
      </a>

      <a routerLink="/knowledgebase" routerLinkActive="bg-blue-600" (click)="isSidebarOpen && closeSidebarOnMobile()"
        class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition-colors mb-2">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span class="font-medium">Knowledgebase</span>
      </a>

      <a routerLink="/logs" routerLinkActive="bg-blue-600" (click)="isSidebarOpen && closeSidebarOnMobile()"
        class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-800 transition-colors">
        <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="font-medium">Live Logs</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-gray-700">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-sm font-bold">TV</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">TurboVets</p>
          <p class="text-xs text-gray-400 truncate">Support Team</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto pt-16 lg:pt-0">
    <router-outlet></router-outlet>
  </main>
</div>
