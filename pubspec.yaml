name: turbovetschat
description: "TurboVets Chat - Flutter Messaging Assessment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  flutter_svg: ^2.2.3
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^9.1.1
  injectable: ^2.7.0
  
  # Navigation
  auto_route: ^11.0.0
  
  # Local Storage
  hive: ^2.2.3
  
  # WebView
  webview_flutter: ^4.13.0
  
  # Utilities
  intl: ^0.20.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.10.4
  injectable_generator: ^2.11.0
  auto_route_generator: ^10.4.0

  
  # Linting
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  assets:
    - assets/icons/
